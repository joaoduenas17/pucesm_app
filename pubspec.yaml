name: pucesm_app

description: "Aplicación académica móvil para estudiantes de PUCE Manabí."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  shared_preferences: ^2.5.4
  provider: ^6.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  webview_flutter: ^4.10.0
  http: ^1.2.2
  intl: ^0.20.2
  flutter_html: ^3.0.0
  url_launcher: ^6.2.0
  add_2_calendar: ^3.0.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  open_filex: ^4.5.0
  flutter_localizations:
    sdk: flutter




dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo_puce.png
    - assets/images/logo_puce.png
    - assets/splash/logo_white.png

# Configuración de iconos de la app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/logo_puce.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/logo_puce.png

# Configuración de pantalla de inicio (splash screen)
flutter_native_splash:
  color: "#0F3796"
  image: assets/splash/logo_white.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#0F3796"
    image: assets/splash/logo_white.png
